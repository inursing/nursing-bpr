<!doctype html><html lang="zh-TW"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>病人與說話狀態預覽</title><link rel="stylesheet" href="modern.css"><style>*{box-sizing:border-box}body{margin:0;padding:32px;font:15px/1.7 system-ui,sans-serif;color:var(--text)}main{max-width:1100px;margin:auto}h1{font-size:28px}p{color:var(--text2)}.demo{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin:26px 0}.stage{height:500px;border:1px solid var(--border);border-radius:22px;overflow:hidden}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.choice{background:var(--surface);padding:0;border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;color:var(--text);font:inherit}.choice img{display:block;width:100%;aspect-ratio:1;object-fit:cover}.choice span{display:block;padding:8px;font-size:12px}.choice[aria-pressed=true]{outline:3px solid var(--accent)}.controls{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}.controls button{border:1px solid var(--border);padding:10px 16px;background:var(--primary);color:white;cursor:pointer;font:inherit;border-radius:10px}.tip{font-size:12px}a{color:var(--accent)}@media(max-width:700px){body{padding:20px}.demo{grid-template-columns:1fr}.stage{height:420px}.choices{gap:8px}}</style><main><span class="welcome-label">NURSING COMMUNICATION STUDIO</span><h1>六位病人，六段練習對話。</h1><p>選擇人物，核對年齡與性別。人物維持穩定，不再切換嘴型或晃動。</p><div class="demo"><div><div class="stage"><div id="avatar-3d"></div></div><div class="controls"><button id="talk">測試說話狀態</button></div><p class="tip">此頁只測試說話狀態，不播放聲音，也不使用麥克風或付費服務。低頭、轉頭等自然連續動作需使用另行製作的綁定人物模型，這裡不以切圖代替。</p></div><div class="choices"><button class="choice" data-index="0" aria-pressed="true"><img src="portraits/wang.png" alt="65歲男性病人"><span>王○明 · 65 歲 · 男<br>心臟內科</span></button><button class="choice" data-index="1" aria-pressed="false"><img src="portraits/li.png" alt="58歲女性病人"><span>李○華 · 58 歲 · 女<br>新陳代謝科</span></button><button class="choice" data-index="2" aria-pressed="false"><img src="portraits/chen.png" alt="72歲男性病人"><span>陳○國 · 72 歲 · 男<br>胸腔內科</span></button><button class="choice" data-index="3" aria-pressed="false"><img src="portraits/zhang.png" alt="50歲女性病人"><span>張○玲 · 50 歲 · 女<br>乳房外科</span></button><button class="choice" data-index="4" aria-pressed="false"><img src="portraits/lin.png" alt="78歲女性病人"><span>林○英 · 78 歲 · 女<br>骨科</span></button><button class="choice" data-index="5" aria-pressed="false"><img src="portraits/wu.png" alt="45歲男性病人"><span>吳○豪 · 45 歲 · 男<br>一般外科</span></button></div></div><a href="index.html">開啟完整練習平台 →</a></main><script src="patient-view.js"></script><script>const people=[["wang","王○明",65,"男","心臟內科"],["li","李○華",58,"女","新陳代謝科"],["chen","陳○國",72,"男","胸腔內科"],["zhang","張○玲",50,"女","乳房外科"],["lin","林○英",78,"女","骨科"],["wu","吳○豪",45,"男","一般外科"]];let timer;function choose(i){clearTimeout(timer);const [id,name,age,gender]=people[i];Avatar3D.load('portraits/'+id+'.png',{name,age,gender});document.querySelectorAll('.choice').forEach((el,k)=>el.setAttribute('aria-pressed',String(k===i)));}document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>choose(+el.dataset.index));document.getElementById('talk').onclick=()=>{clearTimeout(timer);Avatar3D.startMouth();timer=setTimeout(()=>Avatar3D.stopMouth(),5000);};choose(0);</script></html>
